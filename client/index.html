    <style>
      /* Pre-boot instant 3D splash screen style (Replaced seamlessly when React mounts) */
      #db-preboot-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 45%, #022c22 0%, #011d16 55%, #010f0c 100%);
        color: #ffffff;
        font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
        overflow: hidden;
        perspective: 1200px;
      }
      .db-splash-glow {
        position: absolute;
        width: 450px;
        height: 450px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.28) 0%, rgba(5, 150, 105, 0.18) 50%, transparent 75%);
        filter: blur(40px);
        animation: dbPulse 2.8s ease-in-out infinite alternate;
      }
      .db-splash-stage {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        transform-style: preserve-3d;
      }
      .db-splash-halo {
        position: relative;
        width: 140px;
        height: 140px;
        display: flex;
        align-items: center;
        justify-content: center;
        transform-style: preserve-3d;
      }
      .db-splash-ring-1 {
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        border: 2px dashed rgba(212, 175, 55, 0.45);
        transform: rotateX(68deg) rotateY(-18deg);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
        animation: dbRotateRing 10s linear infinite;
      }
      .db-splash-ring-2 {
        position: absolute;
        width: 155px;
        height: 155px;
        border-radius: 50%;
        border: 1.5px solid rgba(52, 211, 153, 0.35);
        transform: rotateX(-62deg) rotateY(24deg);
        animation: dbCounterRotateRing 14s linear infinite;
      }
      .db-splash-medallion {
        position: relative;
        z-index: 20;
        width: 110px;
        height: 110px;
        border-radius: 28px;
        padding: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 35% 30%, #065f46 0%, #022c22 60%, #01140e 100%);
        border: 2px solid rgba(254, 240, 138, 0.45);
        box-shadow: 0 20px 45px -8px rgba(0, 0, 0, 0.85), 0 0 30px rgba(212, 175, 55, 0.4), inset 0 2px 4px rgba(254, 240, 138, 0.7);
        transform: translateZ(30px);
        animation: dbFloat 3s ease-in-out infinite alternate;
      }
      .db-splash-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: brightness(1.08) drop-shadow(0 6px 16px rgba(212, 175, 55, 0.65));
      }
      .db-splash-title {
        margin-top: 24px;
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #ffffff 0%, #fef08a 40%, #d4af37 75%, #b45309 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
      }
      .db-splash-sub {
        margin-top: 5px;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.25em;
        color: rgba(253, 224, 71, 0.9);
      }
      .db-splash-bar-track {
        margin-top: 24px;
        width: 180px;
        height: 5px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(52, 211, 153, 0.25);
        overflow: hidden;
        position: relative;
      }
      .db-splash-bar-thumb {
        position: absolute;
        height: 100%;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, #d4af37, #fef08a, #34d399);
        box-shadow: 0 0 12px rgba(212, 175, 55, 0.9);
        animation: dbBar 1.3s ease-in-out infinite;
      }
      @keyframes dbRotateRing {
        from { transform: rotateX(68deg) rotateY(-18deg) rotateZ(0deg); }
        to { transform: rotateX(68deg) rotateY(-18deg) rotateZ(360deg); }
      }
      @keyframes dbCounterRotateRing {
        from { transform: rotateX(-62deg) rotateY(24deg) rotateZ(0deg); }
        to { transform: rotateX(-62deg) rotateY(24deg) rotateZ(-360deg); }
      }
      @keyframes dbFloat {
        0% { transform: translateY(-3px) translateZ(30px); }
        100% { transform: translateY(3px) translateZ(30px); }
      }
      @keyframes dbPulse {
        from { transform: scale(0.9); opacity: 0.6; }
        to { transform: scale(1.15); opacity: 1; }
      }
      @keyframes dbBar {
        0% { left: -50%; width: 30%; }
        50% { width: 60%; }
        100% { left: 110%; width: 30%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant preboot display until React bundle executes -->
      <div id="db-preboot-splash">
        <div class="db-splash-glow"></div>
        <div class="db-splash-stage">
          <div class="db-splash-halo">
            <div class="db-splash-ring-1"></div>
            <div class="db-splash-ring-2"></div>
            <div class="db-splash-medallion">
              <img src="/logo.png" alt="Darse Burhani Emblem" class="db-splash-logo" />
            </div>
          </div>
          <div class="db-splash-title">Darse Burhani (Nisab)</div>
          <div class="db-splash-sub">Mahad al Zahra</div>
          <div class="db-splash-bar-track">
            <div class="db-splash-bar-thumb"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
