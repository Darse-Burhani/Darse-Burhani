        <h1>Darse Burhani (Nisab) — Mahad al Zahra Academic Portal</h1>
        <p>
          Welcome to Darse Burhani, the comprehensive academic administration, biometric attendance telemetry, and student progress intelligence platform for Mahad al-Zahra, Galiakot Campus. Darse Burhani connects administrative governance, faculty instruction, student scholarship, and parental engagement into a single unified ecosystem.
        </p>
        <h2>Institutional Academic Modules</h2>
        <ul>
          <li><strong>Central Governance (Admin Portal):</strong> Campus-wide oversight, biometric Hikvision telemetry synchronization, Tilawat al-Dua morning scanning schedules, faculty timetable slot allocations, and parent leave application sanctioning with customized granted periods.</li>
          <li><strong>Faculty &amp; Mashayekh Console:</strong> Comprehensive classroom attendance rosters, Takhteet curriculum planning for Darajah 1 to Darajah 4, weekly Quran Hifz evaluation slips, and academic achievement logging.</li>
          <li><strong>Talabat Student Portal:</strong> Individual student attendance ledgers, Quran memorization progress tracking, Maktabat library catalog reservations, and academic skill tree badges.</li>
          <li><strong>Parent Portal:</strong> Real-time attendance monitoring, direct leave application requests with administrative response tracking, and institutional notifications.</li>
        </ul>
        <h2>Campus Directory &amp; Support</h2>
        <p>
          <strong>Campus Location:</strong> Mahad al-Zahra, Mazaar-e-Fakhri Campus, Galiakot, Dungarpur District, Rajasthan 314026, India.<br />
          <strong>Administrative Support Desk:</strong> <a href="mailto:admin.galiakot@darseburhani.org">admin.galiakot@darseburhani.org</a><br />
          <strong>Official Contact Telephone:</strong> +91 2964 282222
        </p>
