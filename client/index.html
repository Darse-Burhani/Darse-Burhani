<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="Darse Burhani (Nisab) — Mahad al Zahra" />

      property="og:description"
      content="Unified academic portal, biometric attendance telemetry, Quran Hifz tracking, and student engagement console."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://darseburhani.edu/" />
    <meta name="twitter:title" content="Darse Burhani (Nisab) — Mahad al Zahra" />

      name="twitter:description"
      content="Unified academic portal, biometric attendance telemetry, Quran Hifz tracking, and student engagement console."
    />

    <!-- Favicon Suite: logo.png set as primary icon display -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Typography Preconnect & High-End Font Suite -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Outfit:wght@300..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/Al-Kanz.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/logo.png" as="image" type="image/png" />

    <style>
      /* Pre-boot instant splash screen style (Replaced seamlessly when React mounts) */
      #db-preboot-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #022c22 0%, #011a14 70%, #01120e 100%);
        color: #ffffff;
        font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }
      .db-splash-glow {
        position: absolute;
        width: 320px;
        height: 320px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(212, 175, 55, 0.22) 0%, rgba(4, 120, 87, 0.15) 50%, transparent 75%);
        filter: blur(28px);
        animation: dbPulse 2.8s ease-in-out infinite alternate;
      }
      .db-splash-halo {
        position: relative;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 35px rgba(212, 175, 55, 0.35);
      }
      .db-splash-halo::before {
        content: '';
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 2px dashed rgba(212, 175, 55, 0.5);
        animation: dbRotate 12s linear infinite;
      }
      .db-splash-logo {
        width: 80px;
        height: 80px;
        object-fit: contain;
        filter: drop-shadow(0 4px 14px rgba(212, 175, 55, 0.45));
        animation: dbBreathe 2.4s ease-in-out infinite;
      }
      .db-splash-title {
        margin-top: 24px;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #ffffff 0%, #fde047 50%, #d4af37 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .db-splash-sub {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: rgba(212, 175, 55, 0.85);
      }
      .db-splash-bar-track {
        margin-top: 24px;
        width: 140px;
        height: 3px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
        position: relative;
      }
      .db-splash-bar-thumb {
        position: absolute;
        height: 100%;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, #d4af37, #fef08a, #10b981);
        animation: dbBar 1.2s ease-in-out infinite;
      }
      @keyframes dbRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dbBreathe {
        0%, 100% { transform: scale(1); opacity: 0.95; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes dbPulse {
        from { transform: scale(0.9); opacity: 0.6; }
        to { transform: scale(1.15); opacity: 1; }
      }
      @keyframes dbBar {
        0% { left: -50%; width: 30%; }
        50% { width: 60%; }
        100% { left: 110%; width: 30%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Instant preboot display until React bundle executes -->
      <div id="db-preboot-splash">
        <div class="db-splash-glow"></div>
        <div class="db-splash-halo">
          <img src="/logo.png" alt="Darse Burhani Logo" class="db-splash-logo" />
        </div>
        <div class="db-splash-title">Darse Burhani (Nisab)</div>
        <div class="db-splash-sub">Mahad al Zahra</div>
        <div class="db-splash-bar-track">
          <div class="db-splash-bar-thumb"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
