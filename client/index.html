<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Darse Burhani (Nisab) | Mahad al Zahra</title>
    <meta
      name="description"
      content="Unified academic portal, attendance records, Quran Hifz milestones, and student learning platform for Mahad al Zahra."
    />
    <meta name="theme-color" content="#0c1f17" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://darseburhani.edu/" />
    <meta property="og:title" content="Darse Burhani (Nisab) | Mahad al Zahra" />
    <meta
      property="og:description"
      content="Unified academic portal, attendance records, Quran Hifz tracking, and student learning console."
    />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:site_name" content="Darse Burhani" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://darseburhani.edu/" />
    <meta name="twitter:title" content="Darse Burhani (Nisab) | Mahad al Zahra" />
    <meta
      name="twitter:description"
      content="Unified academic portal, biometric attendance telemetry, Quran Hifz tracking, and student engagement console."
    />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Mobile / Web App Homescreen Metadata -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Darse Burhani" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Darse Burhani" />

    <!-- Favicon & Touch Icon Suite -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" type="image/png" href="/logo.png" />
    
    <!-- Apple Touch Icons for iOS Add to Home Screen -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png" />

    <!-- Web Manifest for Android & Desktop PWA -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Typography: Human Editorial Serif & Clean Legible Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="/Al-Kanz.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/logo.png" as="image" type="image/png" />

    <style>
      /* Clean institutional preboot indicator (replaced smoothly on mount) */
      #db-preboot-splash {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f8fafc 0%, #f0fdf4 50%, #fef9c3 100%);
        color: #0f172a;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      }
      .db-splash-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .db-splash-emblem {
        width: 88px;
        height: 88px;
        border-radius: 20px;
        background: #ffffff;
        border: 2px solid #fbbf24;
        box-shadow: 0 20px 40px -10px rgba(5, 150, 105, 0.2), 0 8px 20px -5px rgba(217, 119, 6, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 12px;
      }
      .db-splash-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .db-splash-title {
        margin-top: 20px;
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: #0f172a;
      }
      .db-splash-sub {
        margin-top: 4px;
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.22em;
        color: #b45309;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="db-preboot-splash">
        <div class="db-splash-stage">
          <div class="db-splash-emblem">
            <img src="/logo.png" alt="Darse Burhani Emblem" class="db-splash-logo" />
          </div>
          <div class="db-splash-title">Darse Burhani</div>
          <div class="db-splash-sub">Mahad al Zahra</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
