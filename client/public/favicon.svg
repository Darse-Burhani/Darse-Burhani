<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Royal Fatimi Gold Gradients -->
    <linearGradient id="dbGold3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="25%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="85%" stop-color="#b8860b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="dbGoldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <!-- Deep Imperial Emerald Background Gradient -->
    <radialGradient id="dbEmeraldBg" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="85%" stop-color="#011a14" />
      <stop offset="100%" stop-color="#01120e" />
    </radialGradient>
    <!-- 3D Outer Drop Shadow -->
    <filter id="dbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#d4af37" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- 3D Beveled Shield Base -->
  <rect x="6" y="6" width="116" height="116" rx="32" fill="url(#dbEmeraldBg)" stroke="url(#dbGoldBorder)" stroke-width="3" filter="url(#dbShadow)" />
  
  <!-- Subtle Inner Inset Bevel -->
  <rect x="10" y="10" width="108" height="108" rx="28" fill="none" stroke="#fde047" stroke-width="0.8" opacity="0.35" />

  <!-- Outer Sacred Geometry 8-Pointed Star (Rub-el-Hizb) -->
  <path
    d="M64 16 L76 36 L100 36 L90 56 L112 64 L90 72 L100 92 L76 92 L64 112 L52 92 L28 92 L38 72 L16 64 L38 56 L28 36 L52 36 Z"
    fill="none"
    stroke="url(#dbGold3D)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Interlocking Rotated Diamond -->
  <rect x="34" y="34" width="60" height="60" transform="rotate(45 64 64)" fill="none" stroke="url(#dbGold3D)" stroke-width="1.8" opacity="0.75" />
  <rect x="34" y="34" width="60" height="60" fill="none" stroke="url(#dbGold3D)" stroke-width="1.8" opacity="0.75" />

  <!-- Concentric Inner Jewel Ring -->
  <circle cx="64" cy="64" r="20" fill="none" stroke="url(#dbGold3D)" stroke-width="2" />
  <circle cx="64" cy="64" r="16" fill="#022c22" stroke="url(#dbGoldBorder)" stroke-width="1" />

  <!-- Central Starburst Core -->
  <path
    d="M64 48 L68 60 L80 64 L68 68 L64 80 L60 68 L48 64 L60 60 Z"
    fill="url(#dbGold3D)"
  />

  <!-- Brilliant Center Jewel Bindu -->
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" />
  <circle cx="64" cy="64" r="2" fill="#d4af37" />

  <!-- 4 Cardinal Vertex Accents -->
  <circle cx="64" cy="20" r="2" fill="#fde047" />
  <circle cx="108" cy="64" r="2" fill="#fde047" />
  <circle cx="64" cy="108" r="2" fill="#fde047" />
  <circle cx="20" cy="64" r="2" fill="#fde047" />
</svg>
