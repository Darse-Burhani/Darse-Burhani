<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </radialGradient>
    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer ring -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#emeraldGlow)" stroke-width="3" filter="url(#logoGlow)"/>
  
  <!-- Inner golden ring -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#goldGlow)" stroke-width="2" stroke-dasharray="8 4"/>
  
  <!-- Central emblem background -->
  <circle cx="64" cy="64" r="44" fill="url(#centerGlow)" filter="url(#logoGlow)"/>
  
  <!-- Arabic calligraphy-inspired book symbol -->
  <g transform="translate(64, 64)">
    <!-- Book base -->
    <path d="M-22,0 L-22,-32 Q-22,-38 -16,-38 L16,-38 Q22,-38 22,-32 L22,0 Z" fill="url(#emeraldGlow)" opacity="0.15"/>
    <path d="M-22,0 L-22,-32 Q-22,-38 -16,-38 L16,-38 Q22,-38 22,-32 L22,0 Z" fill="none" stroke="url(#emeraldGlow)" stroke-width="1.5"/>
    
    <!-- Book spine -->
    <rect x="-22" y="-32" width="44" height="6" rx="1" fill="url(#goldGlow)"/>
    
    <!-- Pages indicator -->
    <line x1="-16" y1="-30" x2="-16" y2="0" stroke="url(#goldGlow)" stroke-width="1" opacity="0.6"/>
    <line x1="0" y1="-30" x2="0" y2="0" stroke="url(#goldGlow)" stroke-width="1" opacity="0.6"/>
    <line x1="16" y1="-30" x2="16" y2="0" stroke="url(#goldGlow)" stroke-width="1" opacity="0.6"/>
    
    <!-- Sacred geometry - 8-pointed star (khatam) -->
    <g stroke="url(#goldGlow)" stroke-width="1.2" fill="none">
      <polygon points="0,-28 4,-10 22,-8 7,2 11,20 0,12 -11,20 -7,2 -22,-8 -4,-10"/>
      <circle cx="0" cy="-2" r="14" stroke-dasharray="4 3" opacity="0.7"/>
    </g>
    
    <!-- Central dot (nur) -->
    <circle cx="0" cy="-2" r="3" fill="url(#goldGlow)"/>
  </g>
  
  <!-- Outer Arabic-inspired decorative elements -->
  <g stroke="url(#emeraldGlow)" stroke-width="1" fill="none" opacity="0.6">
    <!-- Top crescent -->
    <path d="M64,8 Q80,18 64,28 Q48,18 64,8"/>
    <!-- Bottom crescent -->
    <path d="M64,120 Q80,110 64,100 Q48,110 64,120"/>
    <!-- Left crescent -->
    <path d="M8,64 Q18,48 28,64 Q18,80 8,64"/>
    <!-- Right crescent -->
    <path d="M120,64 Q110,48 100,64 Q110,80 120,64"/>
  </g>
</svg>