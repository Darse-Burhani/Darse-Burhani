services:
  - type: web
    name: darse-burhani
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && node scripts/prisma-safe.mjs db push --skip-generate && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_CONNECTION_LIMIT
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: LEAVE_ADMIN_EMAIL
        value: admin.galiakot@darseburhani.org
      - key: LEAVE_SMTP_USER
        value: admin.galiakot@darseburhani.org
      - key: LEAVE_SMTP_PASS
        sync: false
      - key: LEAVE_SMTP_HOST
        value: smtp.gmail.com
      - key: LEAVE_SMTP_PORT
        value: "587"
      - key: LEAVE_SMTP_SECURE
        value: "false"
      - key: RESEND_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false


