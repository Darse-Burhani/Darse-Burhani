# ==============================================================================
# DARSE BURHANI — HIGH-CONCURRENCY LOAD BALANCER CONFIGURATION (NGINX)
# Optimized for 5,000+ Concurrent Active Users with Sub-100ms Latency
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 10240;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── High-Speed Network & I/O Tuning ──
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ── Connection Timeouts (Tuned for 5,000+ Active Clients) ──
    keepalive_timeout 65;
    keepalive_requests 100000;
    client_body_timeout 15;
    client_header_timeout 15;
    send_timeout 15;

    # ── Buffer Sizes (Prevents Disk Swapping Under Heavy Load) ──
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 32k;
    client_max_body_size 50M;

    # Proxy Buffer Tuning
    proxy_buffer_size 128k;
    proxy_buffers 8 128k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 60s;

    # ── Gzip Compression (Reduces Bandwidth Usage by ~70%) ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Rate Limiting Zones (Protects from DDoS while allowing 5,000 legit users) ──
    # Global zone: 100 requests/second per IP with burst of 200
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=100r/s;
    # Login zone: 10 requests/minute to prevent brute-force
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

    # ── Logging Format ──
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main buffer=64k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ── Upstream Node.js Backend Cluster ──
    # Uses least_conn algorithm to distribute 5,000 users to least busy backend instances
    upstream darse_backend_cluster {
        least_conn;

        # Primary application instances (Ports 4000-4003 or multi-container hostnames)
        server 127.0.0.1:4000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:4001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:4002 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:4003 max_fails=3 fail_timeout=10s;

        # Keepalive connection pool to upstreams to reduce TCP handshake overhead
        keepalive 128;
    }

    # ── HTTP Server (Redirect to HTTPS or serve direct) ──
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Healthcheck endpoint (Bypasses all logging and rate limiting)
        location /health {
            access_log off;
            proxy_pass http://darse_backend_cluster/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Static Frontend Assets Caching (Vite Assets) ──
        # Offloads ~80% of traffic directly from Node.js, ensuring 5,000 users get instant load
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp|avif)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;

            proxy_pass http://darse_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Real-Time Streaming & WebSockets (SSE, Biometric Scans, Chat) ──
        location ~* ^/(?:api/biometric/events|api/hikvision/events|api/notifications/stream) {
            proxy_pass http://darse_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for real-time SSE streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Authentication Endpoints (Brute-Force Guard) ──
        location ~* ^/api/(?:login|auth/login) {
            limit_req zone=auth_limit burst=20 nodelay;

            proxy_pass http://darse_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── General API Endpoints ──
        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;

            proxy_pass http://darse_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Main Application Routing ──
        location / {
            proxy_pass http://darse_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
